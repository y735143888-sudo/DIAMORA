<head>
    <meta charset="UTF-8">

    <link rel="stylesheet"
          href="../css/all.min.css">

    <link rel="stylesheet" href="../css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/toastr.local.css">

</head>
 
<body>
 
<div class="top-bar">
    <div>مرحبًا بكم في <span>DIAMORA</span> للمجوهرات</div>
</div>

<header class="header">
    <div class="logo">
        <div class="diamond"><i class="fa-regular fa-gem"></i></div>
        <div><h1>DIAMORA</h1><p>GOLD &amp; DIAMOND</p></div>
    </div>

    <nav class="nav">
            <a href="index.html">الرئيسية</a>
            <a href="jewelry.html">المجوهرات</a>
            <a href="diamonds.html">الألماس</a>
            <a href="about.html">من نحن</a>
            <a href="contact.html">تواصل معنا</a>
    </nav>

    <div class="header-actions">
        <a href="login.html" class="header-action-link">
            <span class="action-diamond"><i class="fa-regular fa-gem"></i></span>
            <span>تسجيل الدخول</span>
        </a>
        <a href="register.html" class="header-action-link">
            <span class="action-diamond"><i class="fa-solid fa-gem"></i></span>
            <span>إنشاء حساب</span>
        </a>
    </div>
</header>
 
 
<section class="login-page">
 
    <div class="login-box">
 
        <div class="login-icon">
            <i class="fa-regular fa-user"></i>
        </div>
 
        <h2>تسجيل الدخول</h2>
 
        <p>مرحبًا بك مجددًا في DIAMORA</p>
 
 
        <form id="loginForm" novalidate>
 
            <label>البريد الإلكتروني</label>
 
            <input
                type="email"
                id="loginEmail"
                placeholder="أدخل بريدك الإلكتروني"
                required
            >
 
 
            <label>كلمة المرور</label>
 
            <input
                type="password"
                id="loginPassword"
                placeholder="أدخل كلمة المرور"
                required
            >
 
 
            <button type="submit">
                تسجيل الدخول
            </button>
 
        </form>
 
 
        <p class="register-link">
            ليس لديك حساب؟
            <a href="register.html">إنشاء حساب</a>
        </p>
 
    </div>
 
</section>
 
 
<footer>
 
    <h2>DIAMORA</h2>
 
    <p>GOLD & DIAMOND</p>
 
    <span>© 2026 DIAMORA. جميع الحقوق محفوظة.</span>
 
</footer>
 

    <script src="../js/vendor/jquery-3.7.1.min.js"></script>
    <script src="../js/toastr.local.js"></script>

    <script src="../js/script.js"></script>

</body>
 
</html>
