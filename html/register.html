<head>
    <meta charset="UTF-8">

    <!-- ملف التنسيقات الخاص بالمشروع -->


    <link rel="stylesheet" href="../css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/toastr.local.css">

</head>

<body>

<div class="top-bar">
    <div>مرحبًا بكم في <span>DIAMORA</span> للمجوهرات</div>
</div>

<header class="header">
    <div class="logo">
        <div class="diamond"><i class="fa-regular fa-gem"></i></div>
        <div><h1>DIAMORA</h1><p>GOLD &amp; DIAMOND</p></div>
    </div>

    <nav class="nav">
            <a href="index.html">الرئيسية</a>
            <a href="jewelry.html">المجوهرات</a>
            <a href="diamonds.html">الألماس</a>
            <a href="about.html">من نحن</a>
            <a href="contact.html">تواصل معنا</a>
    </nav>

    <div class="header-actions">
        <a href="login.html" class="header-action-link">
            <span class="action-diamond"><i class="fa-regular fa-gem"></i></span>
            <span>تسجيل الدخول</span>
        </a>
        <a href="register.html" class="header-action-link">
            <span class="action-diamond"><i class="fa-solid fa-gem"></i></span>
            <span>إنشاء حساب</span>
        </a>
    </div>
</header>


<section class="register-page">

    <div class="register-box">

        <div class="register-icon">
            <i class="fa-regular fa-user"></i>
        </div>

        <h2>إنشاء حساب</h2>

        <p>أنشئي حسابك في DIAMORA</p>

        <form id="registerForm" novalidate>

            <label>الاسم الكامل</label>
            <input type="text"
                   id="registerName"
                   placeholder="أدخل اسمك الكامل"
                   required>

            <label>البريد الإلكتروني</label>
            <input type="email"
                   id="registerEmail"
                   placeholder="أدخل بريدك الإلكتروني"
                   required>

            <label>كلمة المرور</label>
            <input type="password"
                   id="registerPassword"
                   placeholder="أدخل كلمة المرور"
                   required>

            <label>تأكيد كلمة المرور</label>
            <input type="password"
                   id="confirmPassword"
                   placeholder="أعد إدخال كلمة المرور"
                   required>

            <button type="submit">إنشاء حساب</button>

        </form>

        <p class="login-link">
            لديك حساب بالفعل؟
            <a href="login.html">تسجيل الدخول</a>
        </p>

    </div>

</section>


<footer>

    <h2>DIAMORA</h2>

    <p>GOLD & DIAMOND</p>

    <span>© 2026 DIAMORA. جميع الحقوق محفوظة.</span>

</footer>
<div class="diamora-toast-wrap" aria-live="polite"></div>
<script src="../js/vendor/jquery-3.7.1.min.js"></script>
    <script src="../js/toastr.local.js"></script>
    <script src="../js/bootstrap.bundle.min.js"></script>
    <script src="../js/script.js"></script>

</body>
</html>
